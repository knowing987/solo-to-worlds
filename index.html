<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솔랭에서 롤드컵까지</title>
<meta name="description" content="LoL pro career simulation · 롤 프로게이머 커리어 시뮬레이션">
<meta name="theme-color" content="#121726">
<meta name="apple-mobile-web-app-capable" content="yes">
<script data-goatcounter="https://game4world.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Broadcast booth: white panels on cool steel, blue-side vs red-side accents, dark scoreboard strips for anything live. One column, phone first. */
  --bg: #eceff5;
  --panel: #ffffff;
  --panel2: #f3f5f9;
  --line: #dfe3eb;
  --text: #121826;
  --mute: #5f697b;
  --blue: #2a5bd7;
  --blue-soft: #e6edfd;
  --red: #d43d51;
  --gold: #a87a1e;
  --good: #15905c;
  --ink: #0e1420;
  --ink2: #172033;
  --ink-line: #273249;
  --ink-text: #e9eef7;
  --ink-mute: #8d99ad;
  --shade: rgba(14, 20, 32, .48);
  --f-disp: 'Do Hyeon', 'Gothic A1', system-ui, sans-serif;
  --f-num: 'Chakra Petch', 'Gothic A1', system-ui, sans-serif;
  --f-body: 'Gothic A1', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e15; --panel: #121925; --panel2: #18212f; --line: #253044; --text: #e6ebf3; --mute: #8b96a8;
    --blue: #5b8cff; --blue-soft: #1a2747; --red: #ff6b7d; --gold: #e0b25c; --good: #3ccf8e;
    --ink: #070b12; --ink2: #101828; --ink-line: #222d42; --shade: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e15; --panel: #121925; --panel2: #18212f; --line: #253044; --text: #e6ebf3; --mute: #8b96a8;
  --blue: #5b8cff; --blue-soft: #1a2747; --red: #ff6b7d; --gold: #e0b25c; --good: #3ccf8e;
  --ink: #070b12; --ink2: #101828; --ink-line: #222d42; --shade: rgba(0, 0, 0, .62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 0 14px; }
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 10px; gap: 10px; }
.top h1 { font-family: var(--f-disp); font-weight: 400; font-size: 23px; letter-spacing: -.2px; }
.top .sub { font-size: 12px; color: var(--mute); }
.top .icons { display: flex; gap: 4px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--mute); }
.icon-btn:hover { background: var(--panel2); color: var(--text); }
.icon-btn svg { width: 21px; height: 21px; }
main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 110px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card.tight { gap: 8px; }
.card h2 { font-size: 17px; font-weight: 800; }
.card h3 { font-size: 15px; font-weight: 800; }
.eyebrow { font-size: 12px; color: var(--mute); font-weight: 600; }
.mute { color: var(--mute); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 3px 0; }
.kv > span:first-child { color: var(--mute); }
.kv b { font-weight: 700; text-align: right; }
.up { color: var(--red); font-weight: 700; }
.down { color: var(--blue); font-weight: 700; }
.hr { height: 1px; background: var(--line); margin: 2px 0; }
.empty { text-align: center; color: var(--mute); font-size: 13px; padding: 18px 0; }

.btn { height: 52px; border-radius: 14px; font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; transition: transform .08s, filter .15s; }
.btn:active { transform: scale(.98); }
.btn.pri { background: var(--blue); color: #fff; }
.btn.pri:hover { filter: brightness(1.06); }
.btn.sec { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--mute); height: 40px; font-weight: 600; font-size: 13px; }
.btn.red { background: var(--red); color: #fff; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.block { width: 100%; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dock { position: sticky; bottom: 0; padding: 12px 0 18px; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--panel2); color: var(--mute); border: 1px solid var(--line); white-space: nowrap; }
.chip.blue { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
.chip.red { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); border-color: transparent; }
.chip.gold { background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold); border-color: transparent; }
.chip.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); border-color: transparent; }
.dot-new { width: 6px; height: 6px; border-radius: 50%; background: var(--red); display: inline-block; margin-left: 4px; vertical-align: middle; }

.badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 11px; color: #fff; flex: none; letter-spacing: -.2px; }
.badge.lg { width: 46px; height: 46px; border-radius: 13px; font-size: 13px; }
.badge.sm { width: 26px; height: 26px; border-radius: 8px; font-size: 9px; }

/* list rows */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.li:first-child { border-top: 0; }
.li .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--panel2); display: grid; place-items: center; color: var(--mute); flex: none; }
.li .ic svg { width: 19px; height: 19px; }
.li .t { font-weight: 700; font-size: 14px; }
.li .s { font-size: 12px; color: var(--mute); }
.li .chev { color: var(--mute); margin-left: auto; flex: none; }
button.li:hover .t { color: var(--blue); }

/* player card */
.pcard { display: flex; gap: 14px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 16px; background: var(--panel2); display: grid; place-items: center; flex: none; overflow: hidden; }
.avatar img, .avatar canvas { width: 56px; height: 56px; image-rendering: pixelated; }
.avatar.lg { width: 84px; height: 84px; border-radius: 20px; }
.avatar.lg img { width: 76px; height: 76px; }
.ovr-line { font-family: var(--f-disp); font-size: 24px; line-height: 1.15; }
.ovr-line .n { font-family: var(--f-num); font-weight: 700; }
.mini-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-top: 4px; }
.mini-stats div { display: flex; flex-direction: column; gap: 1px; }
.mini-stats span { font-size: 11px; color: var(--mute); }
.mini-stats b { font-family: var(--f-num); font-size: 18px; font-weight: 700; }

/* stat bars */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar { display: grid; grid-template-columns: 54px 1fr 46px; align-items: center; gap: 10px; font-size: 13px; }
.bar .track { height: 7px; border-radius: 7px; background: var(--panel2); overflow: hidden; border: 1px solid var(--line); }
.bar .fill { height: 100%; background: var(--mute); border-radius: 7px; transition: width .6s; }
.bar.focus .fill { background: var(--blue); }
.bar .v { font-family: var(--f-num); font-weight: 700; text-align: right; font-size: 14px; }
.bar .v small { font-size: 11px; color: var(--red); margin-left: 2px; }

/* bottom nav */
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: center; padding: 0 14px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
.nav-in { pointer-events: auto; max-width: 532px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; box-shadow: 0 8px 28px rgba(10, 16, 30, .12); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--mute); padding: 6px 0; border-radius: 14px; position: relative; }
.nav button svg { width: 22px; height: 22px; }
.nav button.on { color: var(--text); font-weight: 800; }
.nav button.on svg { color: var(--blue); }
.nav .pip { position: absolute; top: 5px; right: calc(50% - 16px); width: 7px; height: 7px; border-radius: 50%; background: var(--red); }

/* title */
.hero { background: var(--ink); color: var(--ink-text); border: 1px solid var(--ink-line); border-radius: 22px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.hero .kicker { font-size: 12px; color: var(--ink-mute); font-weight: 600; }
.hero h2 { font-family: var(--f-disp); font-weight: 400; font-size: 38px; line-height: 1.08; letter-spacing: -.5px; }
.hero h2 em { font-style: normal; color: #ffd27a; }
.hero p { margin: 0; color: var(--ink-mute); font-size: 13px; max-width: 34ch; }
.hero canvas.rift { position: absolute; right: -54px; top: -54px; width: 190px; height: 190px; opacity: .32; pointer-events: none; }
.hero > *:not(canvas) { position: relative; }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); position: relative; padding-top: 52px; }
.ladder::before { content: ''; position: absolute; left: 10%; right: 10%; top: 63px; height: 2px; background: var(--ink-line); }
.ladder .fillline { position: absolute; left: 10%; top: 63px; height: 2px; background: #ffd27a; }
.ladder .step { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; font-size: 11px; color: var(--ink-mute); }
.ladder .step i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink2); border: 2px solid var(--ink-line); display: block; z-index: 1; margin-top: 6px; }
.ladder .step.on i { background: #ffd27a; border-color: #ffd27a; }
.ladder .step.on { color: var(--ink-text); font-weight: 700; }
.ladder .me { position: absolute; top: 0; transform: translateX(-50%); width: 44px; height: 44px; image-rendering: pixelated; }
.rank-row { display: grid; grid-template-columns: 22px 34px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.rank-row:first-of-type { border-top: 0; }
.rank-row .r { font-family: var(--f-num); font-weight: 700; color: var(--gold); text-align: center; }
.rank-row img { width: 30px; height: 30px; image-rendering: pixelated; }

/* creation */
.steps { display: flex; gap: 5px; justify-content: center; padding: 6px 0 2px; }
.steps i { width: 18px; height: 4px; border-radius: 4px; background: var(--line); }
.steps i.on { background: var(--blue); }
.avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.avatar-grid button { aspect-ratio: 1.15; border-radius: 14px; background: var(--panel2); border: 2px solid transparent; display: grid; place-items: center; }
.avatar-grid button img { width: 70%; image-rendering: pixelated; }
.avatar-grid button.on { border-color: var(--blue); background: var(--blue-soft); }
.field { display: flex; flex-direction: column; gap: 4px; background: var(--panel2); border-radius: 12px; padding: 9px 12px; border: 1px solid var(--line); }
.field label { font-size: 11px; color: var(--mute); font-weight: 600; }
.field input, .field select { border: 0; background: transparent; outline: none; font-weight: 700; font-size: 15px; padding: 0; width: 100%; }
.field select { appearance: none; cursor: pointer; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--panel2); border-radius: 12px; padding: 4px; gap: 4px; border: 1px solid var(--line); }
.seg button { padding: 8px 4px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--mute); }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.opt { border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--panel); width: 100%; }
.opt.on { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.opt .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.opt .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.opt.on .radio { background: var(--blue); border-color: var(--blue); }
.opt.on .radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.pick-list { display: flex; flex-direction: column; }
.pick-list button { display: flex; justify-content: space-between; align-items: center; padding: 13px 10px; border-radius: 12px; font-weight: 700; }
.pick-list button.on { background: var(--blue-soft); color: var(--blue); }
.pick-list .v { font-family: var(--f-num); }
.champ-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.champ-grid button { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 6px; font-weight: 700; font-size: 13px; background: var(--panel); }
.champ-grid button.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }

/* screens over everything */
.screen { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; }
.screen-in { max-width: 560px; margin: 0 auto; min-height: 100%; padding: 22px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.prog-title { font-family: var(--f-disp); font-weight: 400; font-size: 27px; line-height: 1.2; word-break: keep-all; }
.progress { height: 6px; background: var(--panel2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; background: var(--blue); width: 0; border-radius: 6px; }
.ticker { display: flex; flex-direction: column; gap: 6px; }
.ticker div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 13px; display: flex; gap: 8px; align-items: center; animation: rise .35s ease-out; }
.ticker div::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex: none; }
.ticker div.hot::before { background: var(--gold); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.big-n { font-family: var(--f-disp); font-weight: 400; font-size: 30px; line-height: 1.2; }
.big-n .num { color: var(--blue); }
.result-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.result-row:first-child { border-top: 0; }
.result-row .t { font-weight: 700; font-size: 14px; }
.result-row .s { font-size: 12px; color: var(--mute); }
.result-row .p { font-weight: 800; font-size: 14px; text-align: right; }
.result-row .p.win { color: var(--red); }
.result-row .p.gold { color: var(--gold); }

/* modal sheet */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 80; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--panel); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 22px 18px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; animation: up .25s ease-out; position: relative; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sheet .x { position: absolute; right: 12px; top: 12px; }
.sheet h2 { font-size: 20px; font-weight: 800; padding-right: 36px; line-height: 1.35; }
@media (min-width: 620px) { .shade { align-items: center; } .sheet { border-radius: 24px; max-height: 88%; } }
.infobox { background: var(--panel2); border-radius: 14px; padding: 12px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); }
.sign { position: relative; height: 130px; border: 1.5px dashed var(--line); border-radius: 14px; background: var(--panel2); touch-action: none; }
.sign canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
.sign .hint { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--mute); pointer-events: none; }
.event-art { height: 150px; border-radius: 16px; background: var(--ink); display: grid; place-items: center; overflow: hidden; }
.event-art canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.choice { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 2px; width: 100%; }
.choice:hover { border-color: var(--blue); }
.choice b { font-size: 15px; }
.choice span { font-size: 12px; color: var(--mute); }

/* toast */
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 120; background: var(--ink); color: var(--ink-text); padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); width: 520px; animation: rise .25s; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.toast::before { content: '✓'; width: 20px; height: 20px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; font-size: 12px; flex: none; }

/* reactions */
.feed { display: flex; flex-direction: column; gap: 10px; }
.article { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); }
.article .src { font-size: 11px; color: var(--mute); font-weight: 600; }
.article .hd { font-weight: 800; font-size: 14px; line-height: 1.4; }
.cmt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 8px 0; }
.cmt .pf { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; }
.cmt .u { font-size: 12px; font-weight: 800; }
.cmt .b { font-size: 14px; }
.cmt .m { font-size: 11px; color: var(--mute); display: flex; justify-content: space-between; }
.cmt.reply { margin-left: 32px; border-left: 2px solid var(--line); padding-left: 10px; }

/* live broadcast */
.live { background: var(--ink); color: var(--ink-text); border: 1px solid var(--ink-line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.live-title { font-family: var(--f-disp); font-weight: 400; font-size: 22px; line-height: 1.2; }
.live .lhead { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-mute); }
.live .onair { color: #ff6b7d; font-weight: 800; font-family: var(--f-num); letter-spacing: .5px; display: flex; align-items: center; gap: 5px; }
.live .onair::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #ff6b7d; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.score .side { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; text-align: center; }
.score .mid { text-align: center; }
.score .k { font-family: var(--f-num); font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: 1px; }
.score .k .b { color: #6f9bff; }
.score .k .r { color: #ff7d8d; }
.score .clock { font-family: var(--f-num); font-size: 13px; color: var(--ink-mute); margin-top: 4px; }
.sets { display: flex; gap: 4px; justify-content: center; margin-top: 2px; }
.sets i { width: 9px; height: 9px; border-radius: 3px; background: var(--ink-line); }
.sets i.b { background: #6f9bff; }
.sets i.r { background: #ff7d8d; }
.mapwrap { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1; background: #0c1a1a; width: min(100%, 290px); margin: 0 auto; }
.mapwrap canvas { width: 100%; height: 100%; display: block; }
.goldline { height: 44px; border-radius: 12px; background: var(--ink2); overflow: hidden; }
.goldline canvas { width: 100%; height: 100%; display: block; }
.lfeed { display: flex; flex-direction: column; gap: 5px; min-height: 70px; font-size: 13px; }
.lfeed div { background: var(--ink2); border-radius: 10px; padding: 7px 10px; display: flex; gap: 8px; animation: rise .3s; }
.lfeed .tm { font-family: var(--f-num); color: var(--ink-mute); flex: none; }
.lfeed .b { color: #8fb2ff; }
.lfeed .r { color: #ff9aa6; }
.lfeed .me { color: #ffd27a; font-weight: 700; }
.live .btn.sec { background: var(--ink2); border-color: var(--ink-line); color: var(--ink-text); }
.draft { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.draft button { background: var(--ink2); border: 1.5px solid var(--ink-line); color: var(--ink-text); border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }
.draft button:hover { border-color: #6f9bff; }
.draft button b { font-size: 14px; }
.draft button span { font-size: 11px; color: var(--ink-mute); }
.draft button[disabled] { opacity: .35; }
.celebrate { border-radius: 18px; overflow: hidden; background: var(--ink); aspect-ratio: 16/9; }
.celebrate canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }

.foot { font-size: 11px; color: var(--mute); padding: 18px 4px 0; line-height: 1.6; }
.tabs2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel2); border-radius: 12px; padding: 4px; gap: 4px; border: 1px solid var(--line); }
.tabs2 button { padding: 8px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--mute); }
.tabs2 button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.trophy { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.trophy:first-child { border-top: 0; }
.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.statgrid div { display: flex; flex-direction: column; }
.statgrid span { font-size: 11px; color: var(--mute); }
.statgrid b { font-family: var(--f-num); font-size: 19px; font-weight: 700; }
.statgrid b.gold { color: var(--gold); }
.standing { display: grid; grid-template-columns: 22px 26px 1fr 52px 40px; gap: 8px; align-items: center; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
.standing:first-child { border-top: 0; }
.standing.me { font-weight: 800; color: var(--blue); }
.standing .num { text-align: right; }
.textarea { width: 100%; min-height: 90px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); padding: 10px; font-size: 12px; font-family: var(--f-num); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== v2 컴포넌트 ===== */
.phero { background: var(--ink); color: var(--ink-text); border: 1px solid var(--ink-line); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; position: relative; overflow: hidden; }
.phero::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 18px, rgba(255,255,255,.025) 18px 19px); pointer-events: none; }
.phero .pa { width: 92px; height: 92px; border-radius: 18px; background: var(--ink2); display: grid; place-items: center; border: 1px solid var(--ink-line); }
.phero .pa img { width: 80px; height: 80px; image-rendering: pixelated; }
.phero .nk { font-family: var(--f-disp); font-size: 28px; line-height: 1.05; }
.phero .meta { font-size: 12px; color: var(--ink-mute); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cond { display: grid; grid-template-columns: 40px 1fr 30px; gap: 8px; align-items: center; font-size: 11px; color: var(--ink-mute); margin-top: 6px; }
.cond .tr { height: 6px; background: var(--ink2); border-radius: 6px; overflow: hidden; }
.cond .tr i { display: block; height: 100%; border-radius: 6px; }
.cond b { font-family: var(--f-num); color: var(--ink-text); text-align: right; }
.strip { background: var(--ink2); color: var(--ink-text); border-radius: 16px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 12px 16px; border: 1px solid var(--ink-line); }
.strip div { display: flex; flex-direction: column; }
.strip span { font-size: 11px; color: var(--ink-mute); }
.strip b { font-family: var(--f-num); font-size: 24px; font-weight: 700; color: #ffd27a; }
.statwrap { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: center; }
@media (max-width: 380px) { .statwrap { grid-template-columns: 1fr; } .statwrap svg { max-width: 160px; margin: 0 auto; } }
.radar text { font-size: 9px; fill: var(--mute); font-family: var(--f-body); }
.starbar { position: relative; height: 8px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); }
.starbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: linear-gradient(90deg, #e0b25c, #ffd27a); }
.starbar .tk { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--line); }
.unlocks { display: flex; flex-wrap: wrap; gap: 6px; }
.actionbar { position: fixed; left: 0; right: 0; bottom: 84px; z-index: 25; display: flex; justify-content: center; padding: 0 14px; pointer-events: none; }
.actionbar button { pointer-events: auto; max-width: 532px; width: 100%; background: var(--red); color: #fff; border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; text-align: left; box-shadow: 0 8px 24px rgba(212,61,81,.32); }
.actionbar b { font-size: 15px; display: block; }
.actionbar span { font-size: 12px; opacity: .85; }
.actionbar svg { width: 22px; height: 22px; }
main.has-action { padding-bottom: 170px; }
.rosterrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.rosterrow:first-child { border-top: 0; }
.rosterrow .rl { font-family: var(--f-num); font-weight: 700; font-size: 11px; color: var(--mute); background: var(--panel2); border-radius: 8px; height: 26px; display: grid; place-items: center; }
.rosterrow .nm { font-weight: 800; font-size: 14px; }
.rosterrow .sb { font-size: 11px; color: var(--mute); }
.rosterrow.me .nm { color: var(--blue); }
.rosterrow .ov { font-family: var(--f-num); font-weight: 700; }
/* 시즌 진행기 */
.srun-head { display: flex; flex-direction: column; gap: 4px; }
.srun-me { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.srun-me img { width: 40px; height: 40px; image-rendering: pixelated; }
.player-bar { background: var(--ink); color: var(--ink-text); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--ink-line); }
.player-bar .ttl { font-weight: 800; font-size: 14px; }
.player-bar .sub { font-size: 12px; color: var(--ink-mute); }
.player-bar .ctl { display: flex; gap: 6px; }
.player-bar .ctl button { height: 34px; min-width: 34px; padding: 0 9px; border-radius: 10px; background: var(--ink2); border: 1px solid var(--ink-line); color: var(--ink-text); font-family: var(--f-num); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.player-bar .ctl button.on { background: var(--red); border-color: var(--red); }
.player-bar .ctl svg { width: 16px; height: 16px; }
.player-bar .pb { grid-column: 1 / -1; height: 4px; background: var(--ink2); border-radius: 4px; overflow: hidden; }
.player-bar .pb i { display: block; height: 100%; background: var(--red); width: 0; transition: width .3s; }
.logl { display: flex; flex-direction: column; }
.logrow { display: grid; grid-template-columns: 22px 30px 1fr auto; gap: 8px; align-items: center; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 13px; animation: rise .25s; }
.logrow:first-child { border-top: 0; }
.logrow .wl { font-weight: 800; font-size: 12px; text-align: center; border-radius: 6px; padding: 2px 0; }
.logrow .wl.w { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
.logrow .wl.l { color: var(--blue); background: var(--blue-soft); }
.logrow .op { font-weight: 700; }
.logrow .dt { font-size: 11px; color: var(--mute); }
.logrow .rt { font-family: var(--f-num); font-size: 12px; text-align: right; color: var(--mute); }
.logrow.cl { background: color-mix(in srgb, var(--gold) 8%, transparent); }
/* 클러치 */
.cl-board { background: var(--ink); color: var(--ink-text); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; border: 1px solid var(--ink-line); }
.cl-board .sd { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
.cl-board .k { font-family: var(--f-num); font-size: 34px; font-weight: 700; color: #ffd27a; line-height: 1; }
.cl-board .mid { text-align: center; font-family: var(--f-num); }
.cl-board .tm { color: #ff7d8d; font-size: 18px; font-weight: 700; }
.cl-board .tag { background: #ff5d73; color: #fff; border-radius: 6px; font-size: 10px; padding: 2px 6px; font-family: var(--f-body); font-weight: 800; }
.cl-opt { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; width: 100%; align-items: center; }
.cl-opt:hover { border-color: var(--red); }
.cl-opt b { font-size: 14px; }
.cl-opt span.s { font-size: 11px; color: var(--mute); grid-column: 1 / -1; }
.burst { position: fixed; inset: 0; z-index: 140; display: grid; place-items: center; background: radial-gradient(circle at 50% 50%, rgba(255,210,122,.35), rgba(10,14,21,.88) 60%); animation: fade .2s; overflow: hidden; }
.burst.fail { background: radial-gradient(circle at 50% 50%, rgba(91,140,255,.25), rgba(10,14,21,.9) 60%); }
.burst .rays { position: absolute; width: 220vmax; height: 220vmax; background: repeating-conic-gradient(rgba(255,210,122,.16) 0 8deg, transparent 8deg 18deg); animation: spin 12s linear infinite; }
.burst.fail .rays { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.burst .bx { position: relative; text-align: center; color: #fff; padding: 20px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.burst .big { font-family: var(--f-disp); font-size: 64px; line-height: 1; letter-spacing: 1px; color: #fff; text-shadow: 0 4px 0 #b9811d, 0 8px 24px rgba(0,0,0,.45); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
.burst.fail .big { text-shadow: 0 4px 0 #2a4ea8, 0 8px 24px rgba(0,0,0,.45); font-size: 48px; }
.burst .chipy { background: #ffd27a; color: #2b1d05; font-weight: 800; font-size: 12px; border-radius: 6px; padding: 3px 8px; }
.burst .ln { font-size: 14px; opacity: .9; max-width: 30ch; }
.burst .sc { font-family: var(--f-num); font-size: 22px; font-weight: 700; }
.burst canvas { width: 180px; height: 120px; image-rendering: pixelated; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
/* 시즌 계획 */
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.plan-grid button { text-align: left; border: 1.5px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.plan-grid button b { font-size: 14px; }
.plan-grid button span { font-size: 11px; color: var(--mute); }
.plan-grid button.on { border-color: var(--red); background: color-mix(in srgb, var(--red) 9%, var(--panel)); }
.plan-grid button.on b { color: var(--red); }
.plan-grid button[disabled] { opacity: .45; }
.plan-grid .pr { font-family: var(--f-num); font-size: 11px; font-weight: 700; color: var(--mute); }
/* 리포트 */
.report { background: var(--ink); color: var(--ink-text); border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--ink-line); }
.report .eyebrow { color: var(--ink-mute); text-align: center; }
.report h2 { font-family: var(--f-disp); font-weight: 400; font-size: 32px; text-align: center; line-height: 1.1; }
.report .sub { text-align: center; font-size: 13px; color: var(--ink-mute); }
.report .tabs2 { background: var(--ink2); border-color: var(--ink-line); }
.report .tabs2 button { color: var(--ink-mute); }
.report .tabs2 button.on { background: var(--ink); color: var(--ink-text); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles div { background: var(--ink2); border: 1px solid var(--ink-line); border-radius: 12px; padding: 10px 6px; text-align: center; position: relative; }
.tiles span { font-size: 11px; color: var(--ink-mute); display: block; }
.tiles b { font-family: var(--f-num); font-size: 20px; font-weight: 700; }
.tiles i { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); background: #ffd27a; color: #2b1d05; font-style: normal; font-size: 9px; font-weight: 800; border-radius: 5px; padding: 1px 5px; white-space: nowrap; }
.report .kv > span:first-child { color: var(--ink-mute); }
.report .result-row { border-top-color: var(--ink-line); }
.report .result-row .s { color: var(--ink-mute); }
.report .standing { border-top-color: var(--ink-line); }
.report .article, .report .cmt .m { color: var(--ink-text); }
.report .article { background: var(--ink2); border-color: var(--ink-line); }
/* 트로피 진열장 */
.cabinet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cabinet div { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-height: 64px; }
.cabinet b { font-family: var(--f-num); font-size: 22px; font-weight: 700; }
.cabinet b.has { color: var(--gold); }
.cabinet span { font-size: 11px; color: var(--mute); line-height: 1.3; }
/* 명예의 전당 */
.goat { background: linear-gradient(135deg, #1d1606, #0e1420 60%); color: var(--ink-text); border: 1px solid #5a4416; border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; position: relative; overflow: hidden; }
.goat .lbl { font-family: var(--f-num); letter-spacing: 3px; font-size: 12px; color: #ffd27a; font-weight: 700; }
.goat h2 { font-family: var(--f-disp); font-weight: 400; font-size: 40px; line-height: 1; }
.goat .sc { font-family: var(--f-num); font-size: 28px; color: #ffd27a; font-weight: 700; align-self: end; text-align: right; }
.goat p { grid-column: 1 / -1; margin: 0; font-size: 12px; color: var(--ink-mute); }
.rolebest { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rolebest button { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.rolebest span { font-size: 10px; color: var(--red); font-weight: 800; }
.rolebest b { font-size: 12px; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rolebest i { font-style: normal; font-family: var(--f-num); font-size: 11px; color: var(--mute); }
.rk { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.rk:first-child { border-top: 0; }
.rk .n { font-family: var(--f-num); font-weight: 700; color: var(--mute); text-align: center; }
.rk.top .n { color: var(--gold); }
.rk .nm { font-weight: 800; font-size: 14px; }
.rk .sb { font-size: 11px; color: var(--mute); }
.rk .sc { font-family: var(--f-num); font-weight: 700; }
.rk.me { background: var(--blue-soft); border-radius: 10px; padding-left: 6px; padding-right: 6px; }
.segs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.segs button { flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 700; color: var(--mute); }
.segs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.achl { display: flex; flex-direction: column; gap: 6px; }
.achl div { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
.achl div:first-child { border-top: 0; }
.achl em { font-style: normal; font-size: 11px; color: var(--mute); grid-column: 1 / -1; }
.achl em .g { color: var(--blue); font-weight: 700; }
.newsl div { font-size: 13px; padding: 7px 0; border-top: 1px solid var(--line); }
.newsl div:first-child { border-top: 0; }

.report h2, .live-title, .cl-board + .eyebrow + h2 { word-break: keep-all; }

/* ===== v3 디자인: 밤 무대 위 중계 그래픽 =====
   블루 사이드 = 나와 우리 팀, 레드 사이드 = 상대와 위험, 금색 = 명예와 트로피.
   모서리를 잘라 낸 패널, 기울어진 탭과 버튼, 굵은 포스터 글자. */
:root {
  --bg: #e7eaf0; --panel: #ffffff; --panel2: #f1f3f7; --line: #d3d8e2; --text: #111624; --mute: #586276;
  --blue: #2f5fe0; --blue-soft: #e3eafd; --red: #d7354b; --gold: #a6781c; --good: #148a58;
  --ink: #121726; --ink2: #1a2132; --ink-line: #2a3348; --ink-text: #eef1f7; --ink-mute: #8e98ac; --shade: rgba(10, 13, 23, .55);
  --f-disp: 'Black Han Sans', 'Noto Sans SC', 'Apple SD Gothic Neo', sans-serif;
  --f-num: 'Barlow Condensed', 'IBM Plex Sans KR', 'Noto Sans SC', sans-serif;
  --f-body: 'IBM Plex Sans KR', 'Noto Sans SC', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --cut: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1320; --panel: #171d2c; --panel2: #1d2436; --line: #2a3349; --text: #e9edf5; --mute: #8b95aa;
    --blue: #5a86ff; --blue-soft: #1b2748; --red: #ff5468; --gold: #e9ba57; --good: #3ccb8c;
    --ink: #0a0d17; --ink2: #121827; --ink-line: #252e44; --shade: rgba(0, 0, 0, .66);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1320; --panel: #171d2c; --panel2: #1d2436; --line: #2a3349; --text: #e9edf5; --mute: #8b95aa;
  --blue: #5a86ff; --blue-soft: #1b2748; --red: #ff5468; --gold: #e9ba57; --good: #3ccb8c;
  --ink: #0a0d17; --ink2: #121827; --ink-line: #252e44; --shade: rgba(0, 0, 0, .66);
}
body { font-family: var(--f-body); letter-spacing: -.1px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* 머리말: 기울어진 사이드 바 */
.top { border-bottom: 1px solid var(--line); padding: 14px 2px 10px; margin-bottom: 4px; }
.top h1 { font-family: var(--f-disp); font-size: 25px; font-weight: 400; display: flex; align-items: center; gap: 10px; }
.top h1::before { content: ''; width: 9px; height: 22px; background: linear-gradient(var(--blue) 0 50%, var(--red) 50% 100%); transform: skewX(-16deg); flex: none; }
.top .sub { margin-left: 19px; }
.icon-btn { border-radius: 4px; }

/* 패널: 오른쪽 위 모서리를 잘라요 */
.card { border-radius: 3px; clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%); padding: 16px; }
.card h2 { font-family: var(--f-disp); font-weight: 400; font-size: 19px; letter-spacing: 0; }
.card h3 { font-size: 15px; font-weight: 700; }
.hero, .phero, .strip, .live, .goat, .report, .cl-board, .player-bar { border-radius: 3px !important; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
.phero .pa { border-radius: 3px; }
.phero .nk, .hero h2, .prog-title, .live-title, .report h2 { font-family: var(--f-disp); font-weight: 400; }
.strip b, .num, .big-n, .rosterrow .ov, .rk .sc { font-family: var(--f-num); letter-spacing: .2px; }

/* 버튼: 오른쪽 끝이 기울어진 중계 자막 모양 */
.btn { border-radius: 2px; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); font-weight: 700; letter-spacing: 0; }
.btn.sec { background: var(--panel2); }
.btn.ghost { clip-path: none; }
.btn:disabled { opacity: .45; }
.chip { border-radius: 3px; font-weight: 600; }
.icon-btn svg { width: 20px; height: 20px; }

/* 구간 선택 */

/* 나이에 따른 성장 · 늦게 피는 선수 · 갑작스러운 하락 */
function grow() {

    const slump = a >= 23 ? clamp(.025 * (a - 22) + (arc === 'early' ? .07 : 0) - (arc === 'iron' ? .05 : 0) - (p.stats.mental - 70) / 600, 0, .45) : 0;

  }

  p.champs.sort((x, y) => y.m - x.m);

function rosterRows(tid, compact) {
  const ids = (S.rost[tid] || []).slice(); const bench = (S.bench[tid] || []).slice();
  const row = (id, i, sub) => { if (!id) return ''; const pl = P(id); const me = id === 'ME'; const a = pl.ach; const tags = [];
    const w = a.W.length; if (w) tags.push(`롤드컵 ${w}회`); const m = a.M.length; if (m) tags.push(`MSI ${m}회`); const l = a.Lc + (a.L || []).length; if (l) tags.push(`리그 ${l}회`);
    return `<button class="rosterrow ${me ? 'me' : ''}" data-act="player" data-id="${id}"><span class="rl">${sub ? '벤치' : ROLE_LETTER[ROLES[i]]}</span><span><div class="nm">${esc(pl.ign)}${me ? ' (나)' : ''}${pl.ach.HOL ? ' <span class="chip gold" style="padding:0 5px">HoL</span>' : ''}</div><div class="sb">${esc([pl.name, ROLE_KO[pl.role] + ' · ' + ageOf(pl) + '세', ...tags.slice(0, compact ? 2 : 3)].filter(Boolean).join(' · '))}</div></span><span class="ov">${Math.round(me ? ovr() : pl.ovr)}</span></button>`; };
  return ids.map((id, i) => row(id, i, false)).join('') + bench.map(id => row(id, 0, true)).join('');
}
function offerSummary() {
  const o = S.off.offers; const signs = o.filter(x => x.team).length;
  if (o.find(x => x.kind === 'army')) return '군 복무를 이어가요';
  if (o.find(x => x.kind === 'stay')) return `${T(S.p.team).n} 계약 ${S.p.contract.years}년 남음${signs ? ' · 새 제안 도착' : ''}`;
  return signs ? `도착한 제안 ${signs}개` : '아직 제안이 없어요';
}

      if (!k) { const sum = endSeason(); save(); await showReport(sum); closeScreen(); if (typeof boardSubmit === 'function') boardSubmit(); if (S.forceRetire) { await forcedRetire(); FLOW = false; return; } break; }

      const t0 = S.season.ticks.length; RUN.skip = false; RUN.n = 0; RUN.w = 0; RUN.l = 0;
      if (mine) openRunScreen(k, info);
      const gen = stepG(k); let r = gen.next(); let ans;
      while (!r.done) {
        const ev = r.value; ans = undefined;
        if (ev.t === 'match') { if (mine) await addLogRow(ev.row); }
        else if (ev.t === 'clutch') { if (!mine) { r = gen.next(ev.c.rec); continue; } ans = await clutchSheet(ev.c); r = gen.next(ans); await clutchBurst(S.season.lastClutch, !r.done && r.value.t === 'match' ? r.value.row : null); continue; }

        r = gen.next(ans);
      }
      const lines = r.value || [];
      if (mine) await finishRunScreen(lines, S.season.ticks.slice(t0).map(x => x.t));
      const it = checkInterrupt(k); if (it) await handleInterrupt(it);
      save();
    }
  } catch (e) { console.error(e); toast('진행 중 문제가 생겼어요. 다시 시도해 주세요.'); }
  finally { FLOW = false; }

}

      ${S && S.phase !== 'retired' ? `<button class="li" data-resolve="newlife"><span class="ic">${I.person}</span><span class="grow"><div class="t">새로운 인생 시작</div><div class="s">지금 커리어를 지우고 처음부터 시작해요</div></span></button>` : ''}
      ${S && S.phase === 'off' ? `<button class="li" data-resolve="retire"><span class="ic">${I.door}</span><span class="grow"><div class="t">은퇴하기</div><div class="s">선수 생활을 마치고 기록을 남겨요</div></span></button>` : ''}
    </div>`);
  if (!r) return;
  if (r.startsWith('theme:')) { setTheme(r.slice(6)); renderApp(); return openSettings(); }
  if (r.startsWith('lang:')) { setLang(r.slice(5)); renderApp(); return openSettings(); }
  if (r === 'guide') openGuide(); if (r === 'code') openCode(); if (r === 'board') openBoardSetup(); if (r === 'newlife') ACT.newlife(); if (r === 'retire') ACT.retireAsk();
}
function openGuide() {
  openSheet(`<h2>게임 가이드</h2>

    <div class="infobox"><b>한 시즌의 흐름</b><span class="mute">LCK컵(1월) → 퍼스트 스탠드(3월) → 정규시즌 → 로드 투 MSI · MSI(6월) → EWC(7월) → 플레이오프(8월) → 롤드컵(10월) → 케스파컵(12월). 내가 나가지 않는 대회도 매년 열리고, 우승팀 선수들의 업적이 쌓여요.</span></div>
    <div class="infobox"><b>해외 리그</b><span class="mute">실력이 쌓이면 LPL, LEC, LCS, LCP 팀에서 제안이 와요. 계약 중에도 스토브리그에 해외 진출을 요청할 수 있어요. 연봉은 크지만 처음엔 적응도가 낮아 성장이 조금 느려요. 시즌을 보낼수록 적응해요.</span></div>
    <div class="infobox"><b>명예의 전당과 GOAT</b><span class="mute">2024 Faker, 2025 Uzi, 2026 Caps는 실제 헌액자예요. 2027년부터는 매년 업적 점수가 가장 높은 선수(프로 5년 이상)가 헌액돼요. 역대 순위 1위가 GOAT예요. 처음에는 Faker가 GOAT고, 나도 넘어설 수 있어요.</span></div>
    <div class="infobox"><b>국적과 해외 진출</b><span class="mute">국적을 고를 수 있어요. 고향 리그 팀에서는 적응 없이 뛰고, 다른 리그는 첫해 적응 기간이 있어요. 한국 선수도 실력이 쌓이면 해외 제안이 자주 와요.</span></div>
    <div class="infobox"><b>성장은 내 선택으로</b><span class="mute">능력치는 저절로 오르지 않아요. 프리시즌, 시즌 중반, 막바지에 고르는 훈련 강도와 시즌 계획의 집중 훈련, 경기 중 선택이 성장을 결정해요. 고강도 훈련은 크게 자라지만 컨디션과 손목에 부담이 가요.</span></div>
    <div class="infobox"><b>나이와 은퇴</b><span class="mute">10대에는 빠르게 자라고, 20대 중반부터 피지컬이 떨어지기 시작해요. 늦게 꽃이 피거나 갑자기 하락하는 시즌도 있어요. 프로 16시즌을 채우면 은퇴해요.</span></div>
    <div class="infobox"><b>이적 시장과 2세 선수</b><span class="mute">매 시즌 성적에 따라 다른 팀 선수들도 이적해요. Faker는 언제나 T1에 남아요. 슈퍼스타가 은퇴하면 몇 년 뒤 그 2세가 데뷔해요.</span></div>
    <div class="infobox"><b>모두의 기록판</b><span class="mute">시즌이 끝날 때마다 내 커리어가 롤드컵 우승 순 기록판에 올라가요. 설정에서 구글 시트 기록판을 연결하면 다른 플레이어의 기록도 함께 보여요.</span></div>
    <button class="btn pri block" data-close>확인</button>`);
}
async function openCode() {
  const code = S ? encodeSave() : '';

    }
  });
  if (r === 'loaded') { toast('저장 코드를 불러왔어요'); VIEW = 'title'; renderApp(); }
}

  const entry = retire(); if (typeof boardSubmit === 'function') boardSubmit(entry); await showReactSheet(S.feed[0], '은퇴 소식에 반응이 쏟아지고 있어요'); showRetirement(entry);

/* 방문 통계 (GoatCounter, 쿠키 없음): 새 커리어 시작만 따로 세요 */
function gcEvent(path, title) { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, title, event: true }); } catch (e) { } }
/* ---------- 액션 ---------- */
const ACT = {
  tab: el => { VIEW = el.dataset.tab; renderApp(); window.scrollTo(0, 0); },
  lang: el => { setLang(el.dataset.l); renderApp(); },
  copyacct: async () => { try { await navigator.clipboard.writeText(DONATE.acct.replace(/-/g, '')); toast('계좌번호를 복사했어요'); } catch (e) { toast(DONATE.acct); } },
  board: () => openBoard(), boardsetup: () => openBoardSetup(),
  donate: () => { DONATE_OPEN = !DONATE_OPEN; renderApp(); },
  sound: () => { const on = soundToggle(); renderApp(); toast(on ? '배경 음악을 켰어요' : '배경 음악을 껐어요'); },
  dirrole: el => { DIRQ.role = el.dataset.r; renderApp(); }, dirst: el => { DIRQ.st = el.dataset.k; renderApp(); },
  theme: () => { const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); setTheme(cur === 'dark' ? 'light' : 'dark'); },
  settings: () => openSettings(),
  continue: () => { if (S.phase === 'season') runSeasonFlow(); else { VIEW = 'home'; renderApp(); } },
  newlife: async () => {
    if (S && S.phase !== 'retired') { const r = await openSheet(`<h2>새로운 인생을 시작할까요?</h2><div class="small mute">지금 진행 중인 ${esc(S.p.nick)}의 커리어는 사라져요.</div><div class="btn-row"><button class="btn sec" data-close>취소</button><button class="btn red" data-resolve="y">새로 시작</button></div>`); if (r !== 'y') return; }
    clearSave(); S = null; startCreate();
  },
  cav: el => { C.av = +el.dataset.i; renderCreate(); },
  corigin: el => { C.origin = el.dataset.id; renderCreate(); },
  cload: () => { const l = lastCfg(); if (!l) return; Object.assign(C, { nick: l.nick, name: l.name, role: l.role, origin: l.origin, av: l.av, nat: l.nat || C.nat, riot: l.riot || C.riot }); C.style = null; C.champs = []; renderCreate(); },
  cstyle: el => { C.style = el.dataset.id; renderCreate(); },
  cchamp: el => { const n = el.dataset.n; const i = C.champs.indexOf(n); if (i >= 0) C.champs.splice(i, 1); else if (C.champs.length < 2) C.champs.push(n); else { C.champs.shift(); C.champs.push(n); } renderCreate(); },
  cfocus: el => { const k = el.dataset.k; const i = C.focus.indexOf(k); if (i >= 0) C.focus.splice(i, 1); else { if (C.focus.length >= 2) C.focus.shift(); C.focus.push(k); } renderCreate(); },
  cnext: () => {
    if (C.step === 2) {

    }
    C.step++; renderCreate();
  },
  cback: () => { if (C.step <= 1) { closeScreen(); VIEW = 'title'; renderApp(); return; } C.step--; renderCreate(); },
  cdone: () => {
    const cfg = { nick: C.nick.trim().slice(0, 12), name: C.name.trim().slice(0, 6), av: C.av, role: C.role, style: C.style, origin: C.origin, champs: C.champs, focus: C.focus, nat: C.nat, riot: riotNorm(C.riot) };
    try { localStorage.setItem(LAST_KEY, JSON.stringify(cfg)); } catch (e) { }
    newGame(cfg); save(); gcEvent('new-career', '새 인생 시작'); VIEW = 'home'; closeScreen(); renderApp(); runSeasonFlow();
  },
  event: el => openEvent(+el.dataset.i), focus: () => openFocus(), plan: () => openPlan(),

  report: () => { if (S.lastSum) { const sum = S.lastSum; openScreen(''); showReport(sum).then(() => { closeScreen(); renderApp(); }); } },
  request: el => { requestMoveX(el.dataset.k); save(); toast(S.off.note); renderApp(); },
  offer: async el => {
    const o = S.off.offers[+el.dataset.i]; if (!o) return; const p = S.p;
    if (o.kind === 'retire') return ACT.retireAsk();

    if (o.kind) {

      const r = await openSheet(`<h2>${esc(label[0])}</h2><div class="small mute">${esc(label[1])}</div><div class="btn-row"><button class="btn sec" data-close>닫기</button><button class="btn pri" data-resolve="y">선택하기</button></div>`);
